<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIhub Academy — تست‌ها</title>
  <style>
    body { font-family: Tahoma, system-ui, sans-serif; background: #050b1f; color: #eaf2ff; padding: 1rem; line-height: 1.9; }
    .ok { color: #34d399; } .bad { color: #ff7b8f; } h2 { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>تست‌های M1 تا M3</h1>
  <p id="summary">در حال اجرا…</p>
  <div id="out"></div>
  <script type="module">
    import { runTests as m1 } from './m1.test.js';
    import { runTests as m2 } from './m2.test.js';
    import { runTests as m3 } from './m3.test.js';
    import { runTests as m4 } from './m4.test.js';
    import { runTests as m5 } from './m5.test.js';
    import { runTests as m7 } from './m7.test.js';
    const sampleText = await (await fetch('../sample-pack/sample-course.json')).text();
    const out = document.getElementById('out');
    let total = 0, failed = 0;
    for (const [label, run] of [['M1', m1], ['M2', m2], ['M3', m3], ['M4', m4], ['M5', m5], ['M7', m7]]) {
      out.insertAdjacentHTML('beforeend', `<h2>${label}</h2>`);
      const ul = document.createElement('ul'); out.appendChild(ul);
      for (const r of await run({ sampleText })) {
        total++; if (!r.ok) failed++;
        const li = document.createElement('li');
        li.className = r.ok ? 'ok' : 'bad';
        li.textContent = (r.ok ? '✓ ' : '✗ ') + r.name + (r.ok ? '' : ' — ' + r.error);
        ul.appendChild(li);
      }
    }
    document.getElementById('summary').textContent = `${total - failed}/${total} passed`;
    document.title = failed ? 'FAIL' : 'PASS';
  </script>
</body>
</html>
